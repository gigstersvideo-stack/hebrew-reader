<!DOCTYPE html>
<!--
  Without this file, GitHub Pages falls back to rendering README.md via
  Jekyll for the bare domain (no index.html = no override of that default)
  — a visitor landing on the plain https://.../hebrew-reader/ URL would see
  GitHub's own docs-styled README page instead of the actual reader. This
  is a thin, fast redirect to the real entry point, keeping every existing
  link/bookmark to reader-prototype.html itself working unchanged.
-->
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>קורא — читаем истории на иврите с разбором слов</title>
<meta name="description" content="Библиотека историй на иврите по уровням (алеф–гимель) с переводом, огласовками, разбором слов и озвучкой.">
<link rel="canonical" href="https://gigstersvideo-stack.github.io/hebrew-reader/reader-prototype.html">
<meta http-equiv="refresh" content="0; url=reader-prototype.html">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<script>location.replace('reader-prototype.html');</script>
</head>
<body>
<p><a href="reader-prototype.html">קורא</a></p>
</body>
</html>
